
name: Deploy PersonaAI Dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: personaai-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Development
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-2
      LAMBDA_FUNCTION: personaai-dev-api
      API_URL: https://9e42dqyj9a.execute-api.ap-southeast-2.amazonaws.com
      FRONTEND_BUCKET: personaai-dev-frontend-036019073126
      CLOUDFRONT_DISTRIBUTION: EJ040CUSKBV3L

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install Python
        run: uv python install 3.12

      - name: Build Lambda package
        working-directory: backend
        run: uv run deploy.py

      - name: Verify Lambda package
        run: test -f backend/.lambda-build/personaai-lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::036019073126:role/PersonaAI-GitHubActions-Deploy
          aws-region: ap-southeast-2
          allowed-account-ids: "036019073126"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy backend to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file fileb://backend/.lambda-build/personaai-lambda.zip \
            --region "$AWS_REGION"

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
        run: npm run build

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/out/ \
            "s3://$FRONTEND_BUCKET/" \
            --delete \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION" \
            --paths "/*"
      
      - name: Verify deployed API health
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$API_URL/health" | tee health-response.json

          python -c 'import json; data=json.load(open("health-response.json")); assert data["status"] == "healthy", "API health check failed"'
