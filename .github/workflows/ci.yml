
name: PersonaAI CI

on:
  push:
    branches:
      - feature/github-actions-cicd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build Lambda deployment package
        working-directory: backend
        run: uv run deploy.py

      - name: Verify Lambda package exists
        run: test -f ../backend/.lambda-build/personaai-lambda.zip

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  
  frontend-validation:
    name: Validate Next.js Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  
  backend-validation:
    name: Validate FastAPI Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Check Python syntax
        run: uv run python -m compileall -q -f .
