
name: PersonaAI CI

on:
  push:
    branches:
      - feature/github-actions-cicd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build Lambda deployment package
        working-directory: backend
        run: uv run deploy.py

      - name: Verify Lambda package exists
        run: test -f ../backend/.lambda-build/personaai-lambda.zip

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color
